name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: BillNote_frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend, installer and extension
        shell: pwsh
        run: ./packaging/build-release.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bilinote-mini-windows
          path: dist/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/BiliNoteMini-Setup-*.exe
            dist/release/BiliNoteMini-*-Setup.zip
            dist/release/BiliNoteMini-Extension-*.zip
